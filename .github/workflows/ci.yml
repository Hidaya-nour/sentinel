name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22.12.0'

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [api, worker, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint --workspace=${{ matrix.workspace }}

      - name: Typecheck
        run: npm run typecheck --workspace=${{ matrix.workspace }}

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [api, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Run unit tests
        run: npm run test --workspace=${{ matrix.workspace }}
        env:
          # auth.test.ts / auth.service.test.ts need this present at module load,
          # same as local dev - see api/src/lib/auth.ts's fail-fast check.
          JWT_SECRET: ci-test-secret-not-for-production

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sentinel:sentinel@localhost:5432/sentinel_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Apply migrations to test database
        run: npx prisma migrate deploy --schema=api/prisma/schema.prisma

      - name: Run integration tests
        run: npm run test:integration --workspace=api

  e2e-tests:
    name: E2E Tests (full Docker stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root deps (for Playwright)
        run: npm ci --workspace=frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Write infra/.env for Compose
        run: echo "JWT_SECRET=ci-test-secret-not-for-production" > infra/.env

      - name: Build and start full stack
        run: docker compose -f infra/docker-compose.yml --env-file infra/.env up --build -d

      - name: Wait for API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/healthz > /dev/null; then
              echo "API is up"
              exit 0
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
          echo "API did not become healthy in time"
          docker compose -f infra/docker-compose.yml logs
          exit 1

      - name: Run Playwright E2E tests
        run: npm run test:e2e --workspace=frontend
        env:
          E2E_BASE_URL: http://localhost:5173

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  security-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Audit dependencies
        # --audit-level=high: don't fail CI on every low/moderate advisory (there
        # will always be some in a large tree) - fail only on genuinely serious ones.
        # continue-on-error: report findings without blocking, per the "don't block
        # merging yet" decision for the whole pipeline.
        run: npm audit --audit-level=high
        continue-on-error: true
